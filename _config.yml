title: My Notebook/Blog Site
description: Just a simple notebook/blog site built with Jekyll and the Just the Docs theme.
theme: just-the-docs

url: https://stevenwilson123.github.io/

# Ensure consistent navigation ordering
nav_sort: case_insensitive

aux_links:
  Template Repository: https://github.com/just-the-docs/just-the-docs-template


#callouts_level: quiet # or loud
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red